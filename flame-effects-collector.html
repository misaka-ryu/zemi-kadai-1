<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 炎エフェクトコレクター - Pixel Fire Collection</title>
    <style>
        /* ドット絵風フォントの定義 */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Courier New', monospace;
            background: #1a1a2e;
            background-image: 
                radial-gradient(circle at 25% 25%, #16213e 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, #0f3460 0%, transparent 50%);
            min-height: 100vh;
            color: #e94560;
            overflow-x: hidden;
        }

        /* ドット絵風コンテナ */
        .pixel-container {
            background: linear-gradient(45deg, #0f3460, #16213e);
            border: 4px solid #e94560;
            border-radius: 0;
            box-shadow: 
                inset 0 0 0 2px #ff6b8a,
                0 0 20px rgba(233, 69, 96, 0.5),
                0 0 40px rgba(233, 69, 96, 0.3);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* ヘッダー */
        .header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(90deg, #e94560, #ff6b8a, #e94560);
            border-bottom: 4px solid #0f3460;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #0f3460;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #16213e;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #16213e;
            font-weight: 700;
        }

        /* メインコンテナ */
        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        /* アップロードセクション */
        .upload-section {
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 3px solid #e94560;
            position: relative;
        }

        .upload-section::before {
            content: '🔥 ADD FLAME 🔥';
            position: absolute;
            top: -15px;
            left: 20px;
            background: #e94560;
            color: #fff;
            padding: 5px 15px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .upload-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-top: 15px;
        }

        /* ピクセル風ボタン */
        .pixel-button {
            background: linear-gradient(45deg, #e94560, #ff6b8a);
            color: #fff;
            border: 3px solid #fff;
            padding: 12px 20px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px #16213e;
            position: relative;
            overflow: hidden;
        }

        .pixel-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #16213e;
            background: linear-gradient(45deg, #ff6b8a, #e94560);
        }

        .pixel-button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #16213e;
        }

        /* ファイル入力 */
        .file-input {
            display: none;
        }

        .video-title-input {
            background: #1a1a2e;
            border: 2px solid #e94560;
            color: #ff6b8a;
            padding: 10px 15px;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            min-width: 250px;
            outline: none;
        }

        .video-title-input:focus {
            border-color: #ff6b8a;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        /* 動画グリッド */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* 動画カード */
        .video-card {
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 3px solid #e94560;
            padding: 15px;
            position: relative;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .video-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #e94560, #ff6b8a, #e94560);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-card:hover::before {
            opacity: 1;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(233, 69, 96, 0.4);
        }

        .video-title {
            color: #ff6b8a;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .video-player {
            width: 100%;
            height: 200px;
            background: #000;
            border: 2px solid #e94560;
            margin-bottom: 10px;
        }

        .video-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .delete-button {
            background: linear-gradient(45deg, #dc2626, #ef4444);
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 12px;
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .delete-button:hover {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            transform: translateY(-2px);
        }

        /* 炎アニメーション */
        .flame-animation {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
        }

        .flame {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ff6b8a 0%, #e94560 50%, transparent 70%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: rotate(-2deg) scale(1); }
            25% { transform: rotate(2deg) scale(1.1); }
            50% { transform: rotate(-1deg) scale(0.9); }
            75% { transform: rotate(1deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        /* 空の状態 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-flame {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.2rem;
            color: #e94560;
            opacity: 0.7;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            
            .upload-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .videos-grid {
                grid-template-columns: 1fr;
            }
            
            .video-title-input {
                min-width: auto;
                width: 100%;
            }
        }

        /* パーティクルエフェクト */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #e94560;
            opacity: 0.6;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- パーティクルエフェクト -->
    <div class="particles" id="particles"></div>

    <!-- ヘッダー -->
    <header class="header pixel-container">
        <h1 class="title">🔥 FLAME EFFECTS 🔥</h1>
        <p class="subtitle">PIXEL FIRE COLLECTION SYSTEM</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-container">
        <!-- アップロードセクション -->
        <section class="upload-section pixel-container">
            <div class="upload-controls">
                <input type="text" 
                       class="video-title-input" 
                       placeholder="炎エフェクトの名前を入力..." 
                       id="videoTitle">
                
                <input type="file" 
                       class="file-input" 
                       accept="video/*" 
                       id="videoInput">
                
                <button class="pixel-button" onclick="document.getElementById('videoInput').click()">
                    📁 SELECT VIDEO
                </button>
                
                <button class="pixel-button" onclick="addVideo()" id="addButton">
                    ➕ ADD FLAME
                </button>
            </div>
        </section>

        <!-- 動画一覧 -->
        <section class="videos-section">
            <div class="videos-grid" id="videosGrid">
                <!-- 空の状態 -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-flame">🔥</div>
                    <div class="empty-text">まだ炎エフェクトが追加されていません<br>動画を追加してコレクションを始めましょう！</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // グローバル変数
        let videos = JSON.parse(localStorage.getItem('flameVideos')) || [];
        let selectedFile = null;

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            createParticles();
            displayVideos();
        });

        // アプリ初期化
        function initializeApp() {
            const videoInput = document.getElementById('videoInput');
            const videoTitle = document.getElementById('videoTitle');

            videoInput.addEventListener('change', function(e) {
                selectedFile = e.target.files[0];
                if (selectedFile) {
                    const fileName = selectedFile.name.replace(/\.[^/.]+$/, "");
                    if (!videoTitle.value) {
                        videoTitle.value = fileName;
                    }
                    createFlameEffect();
                }
            });

            videoTitle.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addVideo();
                }
            });
        }

        // 動画追加機能
        function addVideo() {
            const titleInput = document.getElementById('videoTitle');
            const title = titleInput.value.trim();

            if (!selectedFile) {
                alert('動画ファイルを選択してください！');
                return;
            }

            if (!title) {
                alert('炎エフェクトの名前を入力してください！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const videoData = {
                    id: Date.now(),
                    title: title,
                    data: e.target.result,
                    addedAt: new Date().toISOString()
                };

                videos.push(videoData);
                saveVideos();
                displayVideos();
                
                // フォームリセット
                titleInput.value = '';
                document.getElementById('videoInput').value = '';
                selectedFile = null;

                createFlameEffect();
                showSuccessMessage('炎エフェクトが追加されました！🔥');
            };

            reader.readAsDataURL(selectedFile);
        }

        // 動画表示
        function displayVideos() {
            const videosGrid = document.getElementById('videosGrid');
            const emptyState = document.getElementById('emptyState');

            if (videos.length === 0) {
                videosGrid.innerHTML = '';
                videosGrid.appendChild(emptyState);
                return;
            }

            videosGrid.innerHTML = '';

            videos.forEach(video => {
                const videoCard = createVideoCard(video);
                videosGrid.appendChild(videoCard);
            });
        }

        // 動画カード作成
        function createVideoCard(video) {
            const card = document.createElement('div');
            card.className = 'video-card pixel-container';
            
            card.innerHTML = `
                <div class="video-title">🔥 ${video.title}</div>
                <video class="video-player" controls preload="metadata">
                    <source src="${video.data}" type="video/mp4">
                    お使いのブラウザは動画再生に対応していません。
                </video>
                <div class="video-controls">
                    <button class="delete-button" onclick="deleteVideo(${video.id})">
                        🗑️ DELETE
                    </button>
                    <button class="pixel-button" onclick="playWithEffect(this)" style="flex: 1; font-size: 0.8rem;">
                        ▶️ PLAY
                    </button>
                </div>
            `;

            return card;
        }

        // 動画削除
        function deleteVideo(id) {
            if (confirm('この炎エフェクトを削除しますか？')) {
                videos = videos.filter(video => video.id !== id);
                saveVideos();
                displayVideos();
                createFlameEffect();
                showSuccessMessage('炎エフェクトが削除されました');
            }
        }

        // エフェクト付き再生
        function playWithEffect(button) {
            const videoCard = button.closest('.video-card');
            const video = videoCard.querySelector('video');
            
            if (video.paused) {
                video.play();
                button.innerHTML = '⏸️ PAUSE';
                createFlameEffect();
                
                // 再生中のエフェクト
                videoCard.style.boxShadow = '0 0 30px #e94560, 0 0 60px #ff6b8a';
                
                video.addEventListener('pause', () => {
                    button.innerHTML = '▶️ PLAY';
                    videoCard.style.boxShadow = '';
                }, { once: true });
                
                video.addEventListener('ended', () => {
                    button.innerHTML = '▶️ PLAY';
                    videoCard.style.boxShadow = '';
                }, { once: true });
            } else {
                video.pause();
                button.innerHTML = '▶️ PLAY';
                videoCard.style.boxShadow = '';
            }
        }

        // データ保存
        function saveVideos() {
            localStorage.setItem('flameVideos', JSON.stringify(videos));
        }

        // 炎エフェクト作成
        function createFlameEffect() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const flame = document.createElement('div');
                    flame.className = 'flame-animation';
                    flame.innerHTML = '<div class="flame"></div>';
                    
                    flame.style.left = Math.random() * window.innerWidth + 'px';
                    flame.style.top = Math.random() * window.innerHeight + 'px';
                    
                    document.body.appendChild(flame);
                    
                    setTimeout(() => {
                        flame.remove();
                    }, 1500);
                }, i * 100);
            }
        }

        // パーティクル作成
        function createParticles() {
            const particles = document.getElementById('particles');
            
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (3 + Math.random() * 3) + 's';
                particles.appendChild(particle);
            }
        }

        // 成功メッセージ
        function showSuccessMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(45deg, #e94560, #ff6b8a);
                color: white;
                padding: 15px 20px;
                border: 3px solid #fff;
                font-family: 'Orbitron', monospace;
                font-weight: 700;
                z-index: 10000;
                box-shadow: 4px 4px 0px #16213e;
            `;
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // キーボードショートカット
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                document.getElementById('videoInput').click();
            }
        });
    </script>
</body>
</html>
